spring:
  kafka:
    bootstrap-servers: localhost:9092

topics:
  sensors: telemetry.sensors.v1
  hubs: telemetry.hubs.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    ru.practicum.telemetry.collector: DEBUG
    org.apache.kafka: WARN